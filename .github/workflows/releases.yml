name: Release

on:
  workflow_dispatch:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

jobs:
  build_artifacts:
    name: Build for ${{ matrix.os_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os_name: FreeBSD-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-freebsd
          - os_name: Linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os_name: Linux-aarch64
            os: ubuntu-latest
            target: aarch64-unknown-linux-musl
          - os_name: Linux-arm
            os: ubuntu-latest
            target: arm-unknown-linux-musleabi
          - os_name: Linux-riscv64
            os: ubuntu-latest
            target: riscv64gc-unknown-linux-gnu
          - os_name: Windows-aarch64
            os: windows-latest
            target: aarch64-pc-windows-msvc
            ext: ".exe"
          - os_name: Windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: ".exe"
          - os_name: macOS-x86_64
            os: macOS-latest
            target: x86_64-apple-darwin
          - os_name: macOS-aarch64
            os: macOS-latest
            target: aarch64-apple-darwin

    steps:
      - uses: actions/checkout@v7
      - name: Build binary
        uses: houseabsolute/actions-rust-cross@v1
        with:
          command: "build"
          target: ${{ matrix.target }}
          toolchain: stable
          args: "--locked --release"
          strip: true
      - name: Rename Artifacts
        shell: bash
        run: |
          APP_NAME=jimtime
          ver=${GITHUB_REF_NAME}
          ASSET_PATH=$APP_NAME-$ver-${{ matrix.target }}${{ matrix.ext }}
          mv target/${{ matrix.target }}/release/$APP_NAME${{ matrix.ext }} $ASSET_PATH
          echo "ASSET_PATH=$ASSET_PATH" >> $GITHUB_ENV
      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ASSET_PATH }}
          path: ${{ env.ASSET_PATH }}

  create_release:
    name: Create GitHub Release
    needs: build_artifacts
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    # The repository default for GITHUB_TOKEN is read-only, which fails the
    # release creation. Only this job needs to write; the build jobs do not.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: ./artifacts

      - name: List downloaded files (debug)
        run: ls -R ./artifacts

      - name: Generate Release Body
        run: |
          cargo install git-cliff --locked
          git-cliff --latest --strip all | sed 1,2d > RELEASE.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: ./artifacts/**/*
          body_path: RELEASE.md
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
