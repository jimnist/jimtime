[package]
name = "jimtime"
version = "0.1.0"
edition = "2024"
authors = ["jimnist <jim@jimnist.com>"]
description = "Track billable time per git repo and push approved entries to Harvest"
readme = "README.md"
license = "MIT"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]

anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Async (tokio + reqwest) for the Harvest API.
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
reqwest = { version = "0.12", features = ["json"] }
async-trait = "0.1"

# Date handling in a fixed billing timezone (America/Los_Angeles), DST-correct.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
chrono-tz = "0.10"
# XDG data-dir fallback when $JIMTIME_HOME is unset.
dirs = "6"



[profile.release]
strip = true
opt-level = "s"
codegen-units = 1
lto = true
panic = "unwind"
